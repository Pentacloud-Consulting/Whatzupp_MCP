<template>
    <div class="launchpad-container">
        <template if:true={isLoading}>
            <div class="spinner-container">
                <lightning-spinner alternative-text="Loading WhatZupp..." size="large" variant="brand"></lightning-spinner>
                <div class="spinner-text">Authenticating securely with WhatZupp...</div>
            </div>
        </template>
        
        <template if:true={error}>
            <div class="error-container">
                <lightning-icon icon-name="utility:error" alternative-text="Error" variant="error" size="large"></lightning-icon>
                <h2 class="slds-text-heading_medium slds-m-top_medium">Launch Failed</h2>
                <p class="slds-text-body_regular slds-m-top_small">{error}</p>
                <lightning-button label="Retry" onclick={initializeLaunchpad} class="slds-m-top_medium" variant="brand"></lightning-button>
            </div>
        </template>

        <iframe 
            if:true={iframeUrl}
            src={iframeUrl} 
            class="whatzupp-iframe" 
            frameborder="0" 
            allow="camera; microphone; fullscreen"
            onload={handleIframeLoad}
        ></iframe>
    </div>
</template>
